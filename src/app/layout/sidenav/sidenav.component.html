<mat-nav-list>
  <a mat-list-item
     *ngFor="let item of menuItems"
     [routerLink]="item.path"
     routerLinkActive="bg-blue-50 text-blue-600"
     class="flex items-center gap-4 h-12 px-4 hover:bg-gray-100">
    <mat-icon class="ml-2 text-gray-600">{{ item.icon }}</mat-icon>
    <span class="text-sm text-gray-800">{{ item.title }}</span>
  </a>
</mat-nav-list>
